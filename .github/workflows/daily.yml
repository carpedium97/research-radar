name: daily radar

on:
  schedule:
    # UTC 22:00 = 台北時間隔天 06:00。GitHub 的排程常有 5-20 分鐘延遲，正常。
    - cron: "0 22 * * *"
  workflow_dispatch:      # 也可以在 Actions 分頁手動按一次

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 跑一次雷達
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python radar.py

      - name: 把結果存回 repo
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add docs state
          git diff --staged --quiet || git commit -m "radar $(date -u +%Y-%m-%d)"
          git push

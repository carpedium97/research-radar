# ============================================================
# Research Radar 設定檔（個人研究雷達，每天跑）
# 跑法：python radar.py
# ============================================================

title: 研究雷達
output: index.html
state: seen.json
feedback: feedback.json
namespace: radar          # 收藏與回饋在瀏覽器裡的儲存空間，不要跟 teaching 相同
group_by: score

siblings:
  精神醫學新知: ./teaching.html

why_instruction: |
  一句正體中文（50 字以內），只寫這篇論文「做了什麼、發現什麼」。
  有數字一定要寫出來：樣本數、效果量、風險比、勝算比、AUC、NNT、追蹤時間。

  嚴格禁止在句子裡或句尾提到這篇跟讀者的關聯。以下這些寫法一律不准出現：
  「直接相關於他的○○主軸」「可應用於」「可借鑑」「值得關注」
  「具有重要意義」「對他的研究有幫助」。
  只要出現任何一句在講「這對讀者有什麼用」，就是錯的。

  好的例子：
    在 12,000 名思覺失調症病人中，clozapine 的一年再住院率比其他
    抗精神病藥低 8.2 個百分點（HR 0.71）。
  壞的例子（絕對不要這樣寫）：
    探討 clozapine 再住院率，直接相關於他的再入院預測主軸。

# 你的研究輪廓 —— 這段會直接送給 Claude 當作打分依據
# 寫得越具體，篩選越準。建議每兩三個月回來修一次。
profile: |
  使用者是臺北市立聯合醫院松德院區的精神科主治醫師，同時是陽明交通大學
  神經科學在職博士生。他的處境決定了什麼論文有價值：臨床負荷重，一年能
  產出的第一／通訊作者論文上限約 2 篇，所以他要的是「會改變他下一步怎麼做」
  的論文，不是領域全景。

  === 第一優先：LLM 臨床文本（博士論文主線）===
  以松德的中文精神科住院病歷（出院病摘、病程紀錄、護理紀錄）做結構化擷取，
  第一篇是思覺失調症再住院預測，第二篇規劃中是成癮族群的結果預測。
  他真正的護城河是那批中文病歷，不是 LLM 方法本身（方法正在快速商品化）。
  因此最有價值的是：
  - evaluation framework、benchmark 建構、標註方法與標註者信度
  - cascaded / multi-stage pipeline、evidence grounding、幻覺與錯誤分析
  - 可地端部署的開源模型（Qwen、Llama）在真實醫院規模上的可行性證據
  - 中文或其他非英語臨床文本
  - 精神科特有的文本任務：症狀擷取、自傷風險、用藥順從性、病程摘要

  === 第二優先：成癮，特別是 GLP-1 ===
  GLP-1 receptor agonist 用於成癮（尤其 amphetamine / methamphetamine use
  disorder，其次酒癮、尼古丁）是他判定近期最有機會切入的題目——該領域
  臨床試驗仍有明顯缺口，而他有現成 cohort 與健保資料庫串接能力。
  任何 GLP-1 與物質使用疾患的臨床試驗、世代研究或機轉研究都要給高分。
  他也持續追：安非他命誘發精神病轉化為思覺失調症、成癮藥物治療試驗。

  === 第三優先：畏懼曠野症（agoraphobia）===
  一條剛啟動的線。該領域的結構性問題是 DSM-5 已將畏懼曠野症與恐慌症分立，
  實證上卻仍被綁在一起。他感興趣的是：純畏懼曠野症的影像或流行病學資料、
  前庭功能假說、焦慮疾患的 normative modeling、DSM-5 後的盛行率、
  數位表型（digital phenotyping），以及行政資料中診斷編碼品質本身的問題
  （爽約率、代領藥、需要人陪同就醫、初次就醫延遲）。

  === 第四優先：方法學工具 ===
  他每年打算自己主導一篇系統性回顧或網絡統合分析（這是他唯一能在不增加
  臨床負擔下自主啟動、且自己掛通訊作者的引擎）。因此 NMA／統合分析的
  方法學進展、偏誤評估工具、報告規範更新，對他有直接的操作價值。

  === 神經影像：只剩選擇性價值 ===
  影像仍是他的背景，但已經不是論文主線。normative modeling（PCNtoolkit）
  與影像 foundation model 若能用在小樣本臨床族群上，仍值得看。
  但 brain age gap 這個領域已過高峰、進入方法學批判與整併期，競爭門檻已經
  推到五位數樣本量，松德規模做不出有競爭力的東西——除非該論文是在提出
  新的方法學批判或重大工具更新，否則一律給低分。
  digital twin brain 是長期押注、不是博論主線，精神科尚無可靠臨床端點，
  給中等分數即可，不要當成高優先。

  === 評分時務必注意的一件事：領域轉移 ===
  「LLM 應用在臨床文本」這個標籤本身不值錢。一篇把 LLM 用在放射科報告、
  骨科病歷、心臟外科出院摘要的論文，只有在它帶來可轉移的方法學時才算高分
  ——例如真實醫院規模的地端部署證據、評估框架設計、錯誤分析方法、
  grounding 機制。如果它只是「換個科別再做一次」，沒有方法上的新東西，
  上限 6 分，不論期刊多好。反過來，精神科或心理衛生領域的同類研究，
  即使規模小，也比非精神科的大規模應用更有價值。

  === 他不需要的 ===
  純工程最佳化（推論加速、量化、kernel、prompt 技巧）；與臨床無關的通用 NLP；
  動物實驗；分子生物機轉；影像硬體與掃描序列開發；純 GWAS 與基因關聯；
  量表開發與心理計量學；只在單一國家健保脈絡下成立、無法外推到台灣的政策研究。

tags:
  - 臨床文本LLM
  - 成癮與GLP-1
  - 畏懼曠野症
  - 精神病理預測
  - 神經影像方法
  - 統合分析方法
  - 其他

# ------------------------------------------------------------
# 陽明圖書館 EZproxy 前綴
# 登入圖書館電子資源後看網址列，把 login?url= 之前那段（含 login?url=）貼進來。
# 常見形式：https://xxxxx.nycu.edu.tw/login?url=
# 留空的話輸出頁就只會有 DOI 原始連結。
# ------------------------------------------------------------
ezproxy_prefix: ""

# 每次回看幾天（排程每天跑，設 3 天可以吃掉週末與延遲）
lookback_days: 3

# 送進 Claude 打分的上限，控制成本用
max_score_items: 150

# 分數門檻
thresholds:
  read: 8      # 這個分數以上放「值得讀」（原本 7，實測每天 5 篇偏多）
  scan: 5      # 這個分數以上放「掃一眼」，其餘收進摺疊區

# 值得讀的每日硬上限。溢出的不會消失，只是降到「掃一眼」。
# 這比調門檻可靠：就算模型某天普遍給高分，清單長度仍然固定。
read_cap: 5

rubric: |
  10 = 這一篇會直接改變他下一步怎麼做（研究設計、投稿定位、計畫書論證）；
  8-9 = 直接命中主線，應該讀完整篇；
  7 = 相關，讀摘要就夠；
  5-6 = 邊緣，掃過標題即可；
  0-4 = 對他沒有用處。
  請嚴格。一天給出 9 分以上的不應超過一篇。
  期刊名氣不是給分理由；只看這篇對「他手上的題目」有沒有實際作用。

# ------------------------------------------------------------
# PubMed
# ------------------------------------------------------------
pubmed:
  # 整本掃過的期刊。名稱要用 PubMed 的 journal title 或縮寫。
  # 沒被 PubMed 收錄的刊物寫了也不會壞，只是抓不到東西。
  journals:
    - "NPJ digital medicine"
    - "NEJM AI"
    - "The Lancet. Digital health"
    - "Journal of the American Medical Informatics Association"
    - "Nature medicine"
    - "NeuroImage"
    - "Imaging neuroscience"
    - "Medical image analysis"
    - "IEEE transactions on medical imaging"
    - "Human brain mapping"
    - "Network neuroscience"
    - "Nature neuroscience"
    - "Nature methods"
    - "Biological psychiatry. Cognitive neuroscience and neuroimaging"
    - "JAMA psychiatry"
    - "The American journal of psychiatry"
    - "Molecular psychiatry"
    - "Addiction"
    - "Schizophrenia bulletin"
  journal_max: 200

  # 全 PubMed 範圍的主題掃描（不限期刊）
  topic_terms:
    - "GLP-1 receptor agonist substance use"
    - "semaglutide addiction"
    - "agoraphobia"
    - "network meta-analysis methodology"
    - "clinical text annotation reliability"
    - "large language model"
    - "clinical natural language processing"
    - "electronic health record prediction"
    - "normative modeling"
    - "psychiatric readmission"
    - "methamphetamine psychosis"
    - "digital twin brain"
    - "foundation model neuroimaging"
  topic_max: 200

# ------------------------------------------------------------
# arXiv
# ------------------------------------------------------------
arxiv:
  categories: [cs.CL, cs.LG, eess.IV, q-bio.NC]
  terms:
    - "clinical notes"
    - "electronic health record"
    - "discharge summary"
    - "psychiatric"
    - "medical large language model"
    - "brain connectivity"
    - "neuroimaging foundation model"
  max_results: 150

# ------------------------------------------------------------
# bioRxiv / medRxiv
# ------------------------------------------------------------
rxiv:
  servers: [medrxiv, biorxiv]
  categories:
    - "psychiatry and clinical psychology"
    - "neuroscience"
    - "health informatics"
    - "addiction medicine"
  # 標題或摘要要命中至少一個才會送去打分（控制成本）
  keywords:
    - language model
    - LLM
    - clinical note
    - electronic health record
    - readmission
    - normative model
    - connectome
    - schizophrenia
    - methamphetamine
    - alcohol use disorder
    - psychosis
    - functional connectivity
